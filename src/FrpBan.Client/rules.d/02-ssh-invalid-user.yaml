# Invalid SSH User Login Rule

rules:
  - name: "Invalid User SSH"
    enabled: true
    logSource:
      type: "file"
      path: "/var/log/auth.log"
    matching:
      - type: "regex"
        # Match the sshd header and complete source field, not IP text inside a username.
        pattern: |-
          (?x)\A
          (?:
            (?:
              [A-Z][a-z]{2}[ ]+[0-9]{1,2}[ ][0-9]{2}:[0-9]{2}:[0-9]{2}
              |
              [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}
              (?:\.[0-9]+)?(?:Z|[+-][0-9]{2}:[0-9]{2})
            )[ ]\S+[ ]
          )?
          sshd(?:-session|-auth)?(?:\[[0-9]+\])?:[ ]
          Invalid[ ]user[ ][^\r\n]*[ ]from[ ]
          (?<ip>\S+)[ ]port[ ][0-9]+(?:[ ]\[preauth\])?\z
    action:
      type: "threshold"
      windowSeconds: 300
      maxMatches: 3
      banDurationSeconds: 1800
      reason: "Invalid SSH user login attempts"
