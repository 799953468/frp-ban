# SSH Brute Force Detection Rule

rules:
  - name: "SSH Brute Force"
    enabled: true
    logSource:
      type: "file"
      path: "/var/log/auth.log"
    matching:
      - type: "regex"
        # Match the sshd header and complete source field, not IP text inside a username.
        pattern: |-
          (?x)\A
          (?:
            (?:
              [A-Z][a-z]{2}[ ]+[0-9]{1,2}[ ][0-9]{2}:[0-9]{2}:[0-9]{2}
              |
              [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}
              (?:\.[0-9]+)?(?:Z|[+-][0-9]{2}:[0-9]{2})
            )[ ]\S+[ ]
          )?
          sshd(?:-session|-auth)?(?:\[[0-9]+\])?:[ ]
          Failed[ ]password[ ]for[ ][^\r\n]*[ ]from[ ]
          (?<ip>\S+)[ ]port[ ][0-9]+[ ]ssh2(?:[ ]\[preauth\])?\z
    action:
      type: "threshold"
      windowSeconds: 600
      maxMatches: 5
      banDurationSeconds: 3600
      reason: "SSH brute force detected"
