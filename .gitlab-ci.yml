default:
  image: mcr.microsoft.com/dotnet/sdk:10.0-noble

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

stages: [test, build, publish]

.dotnet:
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates clang zlib1g-dev
    - curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
    - bash /tmp/dotnet-install.sh --channel 11.0 --quality preview --install-dir "$CI_PROJECT_DIR/.dotnet"
    - export DOTNET_ROOT="$CI_PROJECT_DIR/.dotnet"
    - export PATH="$DOTNET_ROOT:$PATH"

.release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'

test:
  extends: .dotnet
  stage: test
  script:
    - dotnet test FrpBan.slnx -c Release --verbosity normal
    - dotnet publish src/FrpBan/FrpBan.csproj -c Release -p:PublishProfile=NativeAot -o publish/server
    - dotnet publish src/FrpBan.Client/FrpBan.Client.csproj -c Release -p:PublishProfile=NativeAot -o publish/client

.native-build:
  extends: .release
  stage: build
  needs: [test]
  artifacts:
    name: $PROJECT-$CI_COMMIT_TAG-$RID
    paths: [dist/]
    expire_in: 7 days

.unix-build:
  extends: .native-build
  script:
    - dotnet publish "src/$PROJECT/$PROJECT.csproj" -c Release -r "$RID" -p:PublishProfile=NativeAot -p:Version="${CI_COMMIT_TAG#v}" -o publish/app
    - cp LICENSE publish/app/LICENSE
    - mkdir -p dist
    - tar --exclude='*.pdb' --exclude='*.dbg' --exclude='*.dSYM' -czf "dist/$PACKAGE-${CI_COMMIT_TAG#v}-$RID.tar.gz" -C publish/app .

build-linux:
  extends: [.dotnet, .unix-build]
  tags: [$RUNNER_TAG]
  parallel:
    matrix:
      - PROJECT: FrpBan
        PACKAGE: frp-ban
        RUNNER_TAG: [linux-x64, linux-arm64]
      - PROJECT: FrpBan.Client
        PACKAGE: frp-ban-client
        RUNNER_TAG: [linux-x64, linux-arm64]
  variables:
    RID: $RUNNER_TAG

build-alpine:
  extends: .unix-build
  image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
  tags: [$RUNNER_TAG]
  parallel:
    matrix:
      - PROJECT: [FrpBan, FrpBan.Client]
        RID: linux-musl-x64
        RUNNER_TAG: linux-x64
      - PROJECT: [FrpBan, FrpBan.Client]
        RID: linux-musl-arm64
        RUNNER_TAG: linux-arm64
  before_script:
    - apk add --no-cache bash clang build-base zlib-dev icu-dev openssl-dev linux-headers curl
    - curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
    - bash /tmp/dotnet-install.sh --channel 11.0 --quality preview --install-dir "$CI_PROJECT_DIR/.dotnet"
    - export DOTNET_ROOT="$CI_PROJECT_DIR/.dotnet"
    - export PATH="$DOTNET_ROOT:$PATH"
    - if [ "$PROJECT" = FrpBan ]; then export PACKAGE=frp-ban; else export PACKAGE=frp-ban-client; fi

# Shell runners require .NET 11 and the native compiler for their OS.
build-macos:
  extends: .unix-build
  tags: [$RUNNER_TAG]
  parallel:
    matrix:
      - PROJECT: [FrpBan, FrpBan.Client]
        RID: osx-x64
        RUNNER_TAG: macos-x64
      - PROJECT: [FrpBan, FrpBan.Client]
        RID: osx-arm64
        RUNNER_TAG: macos-arm64
  before_script:
    - if [ "$PROJECT" = FrpBan ]; then export PACKAGE=frp-ban; else export PACKAGE=frp-ban-client; fi

build-windows:
  extends: .native-build
  tags: [$RUNNER_TAG]
  parallel:
    matrix:
      - PROJECT: [FrpBan, FrpBan.Client]
        RID: win-x64
        RUNNER_TAG: windows-x64
      - PROJECT: [FrpBan, FrpBan.Client]
        RID: win-arm64
        RUNNER_TAG: windows-arm64
  script:
    - dotnet publish "src/${env:PROJECT}/${env:PROJECT}.csproj" -c Release -r "$env:RID" -p:PublishProfile=NativeAot -p:Version="$($env:CI_COMMIT_TAG.Substring(1))" -o publish/app
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - Copy-Item LICENSE publish/app/LICENSE
    - New-Item -ItemType Directory -Force dist | Out-Null
    - $package = if ($env:PROJECT -eq 'FrpBan') { 'frp-ban' } else { 'frp-ban-client' }
    - Compress-Archive -Path publish/app/* -DestinationPath "dist/$package-$($env:CI_COMMIT_TAG.Substring(1))-$env:RID.zip"

gitlab-release:
  extends: .release
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:latest
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: 'true'
  needs:
    - job: build-linux
      artifacts: true
    - job: build-alpine
      artifacts: true
    - job: build-macos
      artifacts: true
    - job: build-windows
      artifacts: true
  script:
    - test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 16
    - cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS && cd ..
    - glab release create "$CI_COMMIT_TAG" dist/* --name "$CI_COMMIT_TAG" --notes-file packaging/RELEASE_NOTES.md --use-package-registry --package-name frp-ban
