default:
  image: mcr.microsoft.com/dotnet/nightly/sdk:11.0

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Nightly feed for the preview runtime/ILLink packages
  NUGET_PACKAGES: "${CI_PROJECT_DIR}/.nuget/packages"

stages:
  - build
  - release

.before_script_template: &dotnet_setup
  before_script:
    - >
      cat > NuGet.config <<'EOF'
      <?xml version="1.0" encoding="utf-8"?>
      <configuration>
        <packageSources>
          <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
          <add key="dotnet-experimental" value="https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-experimental/nuget/v3/index.json" />
        </packageSources>
      </configuration>
      EOF

# ──────────────────────────────────────────────────────────────────────────────
# Build: triggered on every push / MR
# ──────────────────────────────────────────────────────────────────────────────
build:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG == null'   # skip on tag push — release job covers it
  <<: *dotnet_setup
  script:
    - dotnet restore FrpBan.slnx
    - dotnet build FrpBan.slnx --configuration Release --no-restore
    - >
      dotnet publish src/FrpBan
      -c Release
      -r linux-x64
      --self-contained true
      -p:PublishSingleFile=true
      -p:PublishTrimmed=false
      -o ./publish/linux-x64
  artifacts:
    paths:
      - ./publish/linux-x64/
    expire_in: 1 week

# ──────────────────────────────────────────────────────────────────────────────
# Release: triggered only on vX.Y.Z tags
# ──────────────────────────────────────────────────────────────────────────────
.publish_template: &publish_template
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  <<: *dotnet_setup
  script:
    - dotnet restore FrpBan.slnx
    - >
      dotnet publish src/FrpBan
      -c Release
      -r ${RID}
      --self-contained true
      -p:PublishSingleFile=true
      -p:PublishTrimmed=false
      -o ./publish/${RID}
    - tar -czf frp-ban-${RID}.tar.gz -C ./publish/${RID} .
  artifacts:
    paths:
      - frp-ban-${RID}.tar.gz
    expire_in: never

release:linux-x64:
  <<: *publish_template
  variables:
    RID: linux-x64

release:linux-arm64:
  <<: *publish_template
  variables:
    RID: linux-arm64

# Attach the archives to a GitLab Release entry
gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  needs:
    - release:linux-x64
    - release:linux-arm64
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "frp-ban $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: frp-ban-linux-x64.tar.gz
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/frp-ban-linux-x64.tar.gz?job=release:linux-x64"
        - name: frp-ban-linux-arm64.tar.gz
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/frp-ban-linux-arm64.tar.gz?job=release:linux-arm64"
