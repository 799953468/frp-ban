default:
  image: mcr.microsoft.com/dotnet/sdk:11.0
  tags: [server]

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

stages: [test, build, publish]

.dotnet:
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates zip

.release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'

test:
  extends: .dotnet
  stage: test
  script:
    - apt-get install -y --no-install-recommends python3 jq
    - python3 -m unittest discover -s scripts/tests -v
    - dotnet test FrpBan.slnx -c Release --verbosity normal
    - dotnet publish src/FrpBan/FrpBan.csproj -c Release -r linux-x64 -p:PublishProfile=SelfContained -o publish/server
    - dotnet publish src/FrpBan.Client/FrpBan.Client.csproj -c Release -r linux-x64 -p:PublishProfile=SelfContained -o publish/client

# Managed self-contained publishing supports every target on the Linux runner.
# Keep each archive in its own job so artifact uploads stay small.
build:
  extends: [.dotnet, .release]
  stage: build
  needs: [test]
  parallel:
    matrix:
      - PROJECT: FrpBan
        PACKAGE: frp-ban
        RID: [win-x64, win-arm64, osx-x64, osx-arm64, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64]
      - PROJECT: FrpBan.Client
        PACKAGE: frp-ban-client
        RID: [win-x64, win-arm64, osx-x64, osx-arm64, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64]
  script:
    - |
      set -euo pipefail
      dotnet publish "src/$PROJECT/$PROJECT.csproj" -c Release -r "$RID" \
        -p:PublishProfile=SelfContained -p:Version="${CI_COMMIT_TAG#v}" -o publish/app
      cp LICENSE publish/app/LICENSE
      mkdir -p dist
      case "$RID" in
        win-*)
          (cd publish/app && zip -q -r "../../dist/$PACKAGE-${CI_COMMIT_TAG#v}-$RID.zip" . -x '*.pdb')
          ;;
        *)
          tar --exclude='*.pdb' -czf "dist/$PACKAGE-${CI_COMMIT_TAG#v}-$RID.tar.gz" -C publish/app .
          ;;
      esac
  artifacts:
    name: $PROJECT-$CI_COMMIT_TAG-$RID
    paths: [dist/]
    expire_in: 7 days

gitlab-release:
  extends: .release
  stage: publish
  resource_group: release
  needs:
    - job: build
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates jq
  script:
    - bash scripts/publish-gitlab-release.sh
