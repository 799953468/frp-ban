default:
  image: mcr.microsoft.com/dotnet/sdk:10.0-noble

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

stages:
  - test
  - build
  - publish

.dotnet:
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates python3
    - curl --fail --silent --show-error --location https://dot.net/v1/dotnet-install.sh --output /tmp/dotnet-install.sh
    - bash /tmp/dotnet-install.sh --channel 11.0 --quality preview --install-dir "$CI_PROJECT_DIR/.dotnet"
    - export DOTNET_ROOT="$CI_PROJECT_DIR/.dotnet"
    - export PATH="$DOTNET_ROOT:$CI_PROJECT_DIR/.tools:$PATH"
    - dotnet --version

.release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

test:
  extends: .dotnet
  stage: test
  script:
    - dotnet test FrpBan.slnx -c Release --verbosity normal
    - python3 -m unittest discover -s scripts/tests -v

build:
  extends:
    - .dotnet
    - .release
  stage: build
  needs: [test]
  parallel:
    matrix:
      - RID: [win-x64, win-arm64, osx-x64, osx-arm64, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64]
  script:
    - case "$RID" in linux-*) bash scripts/install-nfpm.sh ;; esac
    - python3 scripts/release.py build "$RID" "$CI_COMMIT_TAG"
  artifacts:
    name: frp-ban-$CI_COMMIT_TAG-$RID
    paths: [dist/]
    expire_in: 7 days

gitlab-release:
  extends: .release
  stage: publish
  image: python:3.12-slim
  needs:
    - job: build
      artifacts: true
  script:
    - python3 scripts/release.py gitlab "$CI_COMMIT_TAG"
