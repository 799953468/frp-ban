default:
  # Pin the GA SDK so an older runner cache cannot supply a preview image.
  image: mcr.microsoft.com/dotnet/sdk:11.0.100@sha256:7913685c883a29dd8ba79da96172f5c6b29ed9be706ebe95935e3ef45f19c9c1
  tags: [server]

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

stages:
  - test
  - build
  - publish

.dotnet:
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates python3
    - export PATH="$CI_PROJECT_DIR/.tools:$PATH"
    - dotnet --version

.release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'

test:
  extends: .dotnet
  stage: test
  script:
    - dotnet test FrpBan.slnx -c Release --verbosity normal
    - python3 -m unittest discover -s scripts/tests -v

build:
  extends:
    - .dotnet
    - .release
  stage: build
  needs: [test]
  parallel:
    matrix:
      - COMPONENT: [server, client]
        RID: [win-x64, win-arm64, osx-x64, osx-arm64, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64]
  script:
    - case "$RID" in linux-*) bash scripts/install-nfpm.sh ;; esac
    - python3 scripts/release.py build "$RID" "$CI_COMMIT_TAG" --component "$COMPONENT"
  artifacts:
    name: frp-ban-$CI_COMMIT_TAG-$COMPONENT-$RID
    paths: [dist/]
    expire_in: 7 days

gitlab-release:
  extends: .release
  stage: publish
  resource_group: release
  image: python:3.12-slim
  needs:
    - job: build
      artifacts: true
  script:
    - python3 scripts/release.py gitlab "$CI_COMMIT_TAG"
