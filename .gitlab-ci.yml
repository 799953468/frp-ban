default:
  # Stable base image with all native deps; install the .NET 11 preview SDK into it.
  image: mcr.microsoft.com/dotnet/sdk:10.0

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

stages:
  - test
  - release

.before_script_template: &dotnet_setup
  before_script:
    - curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 11.0 --quality preview
    - export PATH="$HOME/.dotnet:$PATH"
    - dotnet --version

# ──────────────────────────────────────────────────────────────────────────────
# Test: Run unit tests on every push
# ──────────────────────────────────────────────────────────────────────────────
test:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG == null'
  <<: *dotnet_setup
  script:
    - dotnet restore FrpBan.slnx
    - dotnet test FrpBan.slnx --configuration Release --no-restore --verbosity normal
  coverage: '/^\s*Total\s+\|\s+(\d+\.\d+)%/'

# ──────────────────────────────────────────────────────────────────────────────
# Release Builds: Multi-platform binaries
# ──────────────────────────────────────────────────────────────────────────────
.publish_template: &publish_template
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  <<: *dotnet_setup
  script:
    - dotnet restore FrpBan.slnx
    - >
      dotnet publish src/FrpBan
      -c Release
      -r ${RID}
      --self-contained true
      -p:PublishSingleFile=true
      -p:PublishTrimmed=false
      -o ./publish/${RID}
    - tar -czf frp-ban-${RID}.tar.gz -C ./publish/${RID} .
  artifacts:
    paths:
      - frp-ban-${RID}.tar.gz
    expire_in: never

release:linux-x64:
  <<: *publish_template
  variables:
    RID: linux-x64

release:linux-arm64:
  <<: *publish_template
  variables:
    RID: linux-arm64

# Attach the archives to a GitLab Release entry.
# Use glab directly with explicit host auth — the release-cli image's
# bundled glab does not pick up the self-hosted instance host on its own
# (it hits gitlab.com and gets 404).
gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  needs:
    - release:linux-x64
    - release:linux-arm64
  script:
    - glab auth login --hostname "$CI_SERVER_HOST" --token "$CI_JOB_TOKEN"
    - >
      glab release create "$CI_COMMIT_TAG"
      --repo "$CI_PROJECT_PATH"
      --name "frp-ban $CI_COMMIT_TAG"
      --notes "Release $CI_COMMIT_TAG"
      frp-ban-linux-x64.tar.gz
      frp-ban-linux-arm64.tar.gz
