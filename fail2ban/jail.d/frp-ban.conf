# fail2ban jail for frp-ban plugin API
#
# Install: copy to /etc/fail2ban/jail.d/frp-ban.conf
# Then reload: sudo fail2ban-client reload
#
# This jail watches the access log written by frp-ban for repeated
# unauthorised token attempts and bans the offending IP via iptables.

[frp-ban-api]
enabled  = true
filter   = frp-ban-api
logpath  = /var/log/frp-ban/access.log
maxretry = 5
findtime = 60
bantime  = 3600
action   = iptables-multiport[name=frp-ban-api, port="9000", protocol=tcp]
