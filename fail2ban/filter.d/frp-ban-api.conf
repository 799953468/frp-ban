# fail2ban filter for frp-ban plugin API
# Matches unauthorised access attempts logged by AccessLogService.
# Log format: "YYYY-MM-DD HH:MM:SS [WARN] Unauthorized METHOD /path from IP"
#
# Install: copy to /etc/fail2ban/filter.d/frp-ban-api.conf

[Definition]
failregex = ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} \[WARN\] Unauthorized \S+ \S+ from <HOST>$

ignoreregex =
