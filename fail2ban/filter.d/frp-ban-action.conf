# fail2ban action definition — install to /etc/fail2ban/action.d/frp-ban.conf
# on the CLIENT machine running frpc.
#
# Override frp_ban_url and frp_ban_token in the jail config, e.g.:
#
#   [sshd]
#   action = %(action_mw)s
#            frp-ban[frp_ban_url="https://frps.example.com:9000",
#                    frp_ban_token="your-secret-token"]

[Definition]
actionban   = FRP_BAN_URL="<frp_ban_url>" FRP_BAN_TOKEN="<frp_ban_token>" /opt/frp-ban/fail2ban-action.sh ban   <ip>
actionunban = FRP_BAN_URL="<frp_ban_url>" FRP_BAN_TOKEN="<frp_ban_token>" /opt/frp-ban/fail2ban-action.sh unban <ip>

[Init]
frp_ban_url   = http://127.0.0.1:9000
frp_ban_token = CHANGE_ME
