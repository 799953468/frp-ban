name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        run: python3 scripts/release.py validate "$GITHUB_REF_NAME"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - run: dotnet test FrpBan.slnx -c Release --verbosity normal
      - run: python3 -m unittest discover -s scripts/tests -v

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, osx-x64, osx-arm64, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Install Linux packaging tools
        if: startsWith(matrix.rid, 'linux-')
        run: |
          bash scripts/install-nfpm.sh
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Publish and package ${{ matrix.rid }}
        run: python3 scripts/release.py build "${{ matrix.rid }}" "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: frp-ban-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  create-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: frp-ban-*
          path: dist
          merge-multiple: true
      - name: Verify complete asset set and write checksums
        run: python3 scripts/release.py checksums "$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body_path: packaging/RELEASE_NOTES.md
