name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: ga
      - run: dotnet test FrpBan.slnx -c Release --verbosity normal
      - run: python3 -m unittest discover -s scripts/tests -v

  build:
    needs: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        app:
          - {project: FrpBan, package: frp-ban}
          - {project: FrpBan.Client, package: frp-ban-client}
        rid: [win-x64, win-arm64, osx-x64, osx-arm64, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: ga
      - name: Publish self-contained application
        run: dotnet publish "src/${{ matrix.app.project }}/${{ matrix.app.project }}.csproj" -c Release -r "${{ matrix.rid }}" -p:PublishProfile=SelfContained -p:Version="${GITHUB_REF_NAME#v}" -o publish/app
      - name: Include license
        run: cp LICENSE publish/app/LICENSE
      - name: Archive Windows output
        if: startsWith(matrix.rid, 'win-')
        run: |
          mkdir -p dist
          cd publish/app
          zip -q -r "../../dist/${{ matrix.app.package }}-${GITHUB_REF_NAME#v}-${{ matrix.rid }}.zip" . -x '*.pdb'
      - name: Archive Unix output
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: |
          mkdir -p dist
          tar --exclude='*.pdb' -czf "dist/${{ matrix.app.package }}-${GITHUB_REF_NAME#v}-${{ matrix.rid }}.tar.gz" -C publish/app .
      - uses: actions/upload-artifact@v4
        with:
          name: frp-ban-${{ matrix.app.project }}-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  create-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: frp-ban-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 16
          sha256sum *.zip *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: packaging/RELEASE_NOTES.md
