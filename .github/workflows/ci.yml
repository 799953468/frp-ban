name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: ga
      - name: Run tests
        run: dotnet test FrpBan.slnx -c Release --verbosity normal
      - name: Test GitLab release publishing
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Publish server
        run: dotnet publish src/FrpBan/FrpBan.csproj -c Release -r linux-x64 -p:PublishProfile=SelfContained -o publish/server
      - name: Publish client
        run: dotnet publish src/FrpBan.Client/FrpBan.Client.csproj -c Release -r linux-x64 -p:PublishProfile=SelfContained -o publish/client
      - uses: actions/upload-artifact@v4
        with:
          name: self-contained-linux-x64
          path: |
            publish/server/
            publish/client/
          if-no-files-found: error
          retention-days: 7
